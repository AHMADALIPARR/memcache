<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="ui-sans-serif,system-ui,sans-serif">
  <rect width="960" height="300" fill="#0d1117"/>
  <text x="480" y="36" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="700">Load / store data path</text>

  <rect x="30" y="80" width="140" height="55" rx="10" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
  <text x="100" y="112" text-anchor="middle" fill="#e6edf3" font-size="13">addr, width</text>

  <rect x="200" y="80" width="160" height="55" rx="10" fill="#21262d" stroke="#e94560" stroke-width="2"/>
  <text x="280" y="105" text-anchor="middle" fill="#e6edf3" font-size="12">range_valid?</text>
  <text x="280" y="122" text-anchor="middle" fill="#8b949e" font-size="11">width + bounds</text>

  <rect x="400" y="70" width="130" height="40" rx="8" fill="#21262d" stroke="#e94560"/>
  <text x="465" y="95" text-anchor="middle" fill="#e94560" font-size="12">reject · errors++</text>

  <rect x="400" y="120" width="130" height="40" rx="8" fill="#21262d" stroke="#3fb950"/>
  <text x="465" y="145" text-anchor="middle" fill="#3fb950" font-size="12">accept</text>

  <rect x="560" y="80" width="160" height="55" rx="10" fill="#21262d" stroke="#a371f7" stroke-width="2"/>
  <text x="640" y="105" text-anchor="middle" fill="#e6edf3" font-size="12">slot lookup</text>
  <text x="640" y="122" text-anchor="middle" fill="#8b949e" font-size="11">tag / 4096 slots</text>

  <rect x="750" y="80" width="180" height="55" rx="10" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
  <text x="840" y="105" text-anchor="middle" fill="#e6edf3" font-size="12">extract / write-through</text>
  <text x="840" y="122" text-anchor="middle" fill="#8b949e" font-size="11">LE · cross-word OK</text>

  <path d="M170 107 H200" stroke="#484f58" stroke-width="2"/>
  <path d="M360 95 H400" stroke="#484f58" stroke-width="2"/>
  <path d="M360 120 H400" stroke="#484f58" stroke-width="2"/>
  <path d="M530 140 H560" stroke="#484f58" stroke-width="2"/>
  <path d="M720 107 H750" stroke="#484f58" stroke-width="2"/>

  <text x="480" y="210" text-anchor="middle" fill="#8b949e" font-size="13">Valid(a, w, M)  iff  0 ≤ a ≤ M  and  0 < w ≤ M − a</text>
  <text x="480" y="240" text-anchor="middle" fill="#8b949e" font-size="13">Invalid load returns 0 · invalid store writes nothing · both raise errors</text>
  <text x="480" y="270" text-anchor="middle" fill="#58a6ff" font-size="13">C and Wolfram share the same predicate — checked on 9,909 grid rows</text>
</svg>
