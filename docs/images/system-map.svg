<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="ui-sans-serif,system-ui,sans-serif">
  <rect width="960" height="520" fill="#0d1117"/>
  <text x="480" y="42" text-anchor="middle" fill="#e6edf3" font-size="24" font-weight="700">memcache</text>
  <text x="480" y="68" text-anchor="middle" fill="#8b949e" font-size="13">flat · single-allocation · pointer-arithmetic</text>

  <!-- Single malloc block -->
  <rect x="60" y="100" width="840" height="90" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="480" y="130" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="600">ONE malloc</text>
  <rect x="80" y="145" width="260" height="30" rx="6" fill="#21262d" stroke="#3fb950"/>
  <text x="210" y="165" text-anchor="middle" fill="#e6edf3" font-size="12">backing store (mem)</text>
  <rect x="350" y="145" width="260" height="30" rx="6" fill="#21262d" stroke="#a371f7"/>
  <text x="480" y="165" text-anchor="middle" fill="#e6edf3" font-size="12">word slots (words)</text>
  <rect x="620" y="145" width="260" height="30" rx="6" fill="#21262d" stroke="#e94560"/>
  <text x="750" y="165" text-anchor="middle" fill="#e6edf3" font-size="12">tags (tags)</text>

  <!-- Access path -->
  <rect x="60" y="220" width="280" height="120" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="200" y="250" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Access</text>
  <text x="80" y="280" fill="#8b949e" font-size="12">width in {1, 2, 4, 8}</text>
  <text x="80" y="304" fill="#8b949e" font-size="12">addr + width within capacity</text>
  <text x="80" y="328" fill="#e94560" font-size="12">else: reject, errors++</text>

  <rect x="360" y="220" width="280" height="120" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="500" y="250" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Direct-mapped slot</text>
  <text x="380" y="280" fill="#8b949e" font-size="12">tag = addr >> 3</text>
  <text x="380" y="304" fill="#8b949e" font-size="12">slot = tag & 4095</text>
  <text x="380" y="328" fill="#8b949e" font-size="12">aligned 64-bit word</text>

  <rect x="660" y="220" width="240" height="120" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="780" y="250" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Policy</text>
  <text x="680" y="280" fill="#3fb950" font-size="12">write-through</text>
  <text x="680" y="304" fill="#3fb950" font-size="12">write-allocate</text>
  <text x="680" y="328" fill="#8b949e" font-size="12">LE byte extract</text>

  <!-- Dual model -->
  <rect x="60" y="370" width="420" height="120" rx="12" fill="#161b22" stroke="#e94560" stroke-width="2"/>
  <text x="270" y="400" text-anchor="middle" fill="#e94560" font-size="14" font-weight="600">C11 native</text>
  <text x="80" y="430" fill="#8b949e" font-size="12">memcache.c · driver · replay</text>
  <text x="80" y="454" fill="#8b949e" font-size="12">bounds · OOB · range_grid</text>
  <text x="80" y="478" fill="#8b949e" font-size="12">ASan + UBSan</text>

  <rect x="500" y="370" width="400" height="120" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="700" y="400" text-anchor="middle" fill="#a371f7" font-size="14" font-weight="600">Wolfram reference</text>
  <text x="520" y="430" fill="#8b949e" font-size="12">MemCache.wl model</text>
  <text x="520" y="454" fill="#8b949e" font-size="12">differential A–E checks</text>
  <text x="520" y="478" fill="#8b949e" font-size="12">9,909-row validity grid</text>
</svg>
